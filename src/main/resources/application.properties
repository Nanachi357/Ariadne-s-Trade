spring.application.name=ariadnes-trade

# R2DBC settings for reactive architecture
spring.r2dbc.url=r2dbc:postgresql://localhost:6543/ariadnestrade
spring.r2dbc.username=ariadnes
spring.r2dbc.password=yourpassword

# Flyway settings for automatic creation and updating of tables
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:6543/ariadnestrade
spring.flyway.user=ariadnes
spring.flyway.password=yourpassword
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Settings for SQL initialization (if additional SQL scripts are required after migrations)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Logging settings for debugging
logging.level.org.springframework.r2dbc.core=DEBUG
logging.level.org.springframework=DEBUG

# Settings for saving logs
logging.file.name=logs/app.log
logging.file.path=logs

spring.codec.max-in-memory-size=1MB
